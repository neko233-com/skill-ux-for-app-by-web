[data-style="ink-minimal"] .ux-progress__bar { background: var(--ux-ink); }


/* game-core.css — 游戏原型布局、玩法组件与反馈动画（构建时内联） */

/* 游戏默认竖屏；横屏使用宽画幅并重排 Dock，而不是旋转整页。 */
@media (min-width: 640px) {
  html[data-kind="game"][data-device="phone"][data-orientation-view="landscape"] .ux-frame {
    width: min(900px, calc(100vw - 32px));
    height: min(506px, calc(100vh - 56px));
    height: min(506px, calc(100dvh - 56px));
  }
}

@media (min-width: 640px) {
html[data-kind="game"][data-orientation-view="landscape"] .ux-titlebar {
  min-height: 44px;
  padding-top: 6px;
  padding-bottom: 6px;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-scroll {
  padding: 12px;
}
html[data-kind="game"][data-orientation-view="landscape"][data-nav="dock"] .ux-screens {
  margin-right: 74px;
}
html[data-kind="game"][data-orientation-view="landscape"][data-nav="dock"] .ux-tabbar {
  left: auto;
  top: 0;
  width: 74px;
  min-height: 0;
  flex-direction: column;
  padding: 8px 6px;
  border-top: 0;
  border-left: var(--ux-border-w) solid var(--ux-line);
}
html[data-kind="game"][data-orientation-view="landscape"][data-nav="dock"] .ux-tabbar__item {
  flex: 1 1 0;
  width: 100%;
  min-height: 48px;
  max-height: 76px;
}
html[data-kind="game"][data-orientation-view="landscape"][data-nav="dock"] .ux-tabbar__item .ux-dot,
html[data-kind="game"][data-orientation-view="landscape"][data-nav="dock"] .ux-tabbar__item .ux-badge {
  left: 62%;
}
html[data-kind="game"][data-orientation-view="landscape"][data-nav="dock"] .ux-scroll {
  padding-bottom: 12px;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-toast {
  bottom: 20px;
}
}

/* ── 通用游戏状态与操作 ───────────────────────── */
.u-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
[data-game-root] {
  min-width: 0;
  margin-bottom: 14px;
  color: var(--ux-ink);
}
[data-game-root] button:focus-visible,
[data-game-root] [role="button"]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--ux-accent) 70%, transparent);
  outline-offset: 2px;
}
.ux-game-status {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin-bottom: 8px;
  font-size: var(--ux-fs-xs);
  color: var(--ux-ink-2);
}
.ux-game-status > span { white-space: nowrap; }
.ux-game-status strong {
  color: var(--ux-ink);
  font-variant-numeric: tabular-nums;
}
.ux-game-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 8px 0;
}
.ux-game-actions--spread { justify-content: space-between; }
.ux-game-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  flex: 1 1 auto;
  min-height: 40px;
  padding: 6px 11px;
  border-radius: var(--ux-r-md);
  border: var(--ux-border-w) solid var(--ux-border-c);
  background: var(--ux-surface);
  box-shadow: var(--ux-sh-btn);
  color: var(--ux-ink);
  font-size: var(--ux-fs-xs);
  font-weight: var(--ux-weight-strong);
  transition: transform var(--ux-dur-fast) var(--ux-ease), opacity var(--ux-dur-fast) linear;
}
.ux-game-action--primary { background: var(--ux-primary); color: var(--ux-on-primary); border-color: transparent; }
.ux-game-action--ghost { background: transparent; box-shadow: none; }
.ux-game-action.is-active { background: var(--ux-accent); color: #fff; }
.ux-game-action:active:not(:disabled) { transform: scale(var(--ux-press)); }
.ux-game-action:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.ux-game-log {
  min-height: 34px;
  padding: 8px 10px;
  border-radius: var(--ux-r-sm);
  background: color-mix(in srgb, var(--ux-primary) 8%, var(--ux-surface));
  border-left: 3px solid var(--ux-primary);
  color: var(--ux-ink-2);
  font-size: var(--ux-fs-xs);
  line-height: 1.45;
}

/* ── 头顶状态 / 道具栏与单位 ──────────────────── */
.ux-overhead {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(300px, 100%);
  margin: 8px auto 16px;
  padding: 8px 12px 12px;
  border-radius: var(--ux-r-lg);
  background: color-mix(in srgb, var(--ux-surface) 92%, transparent);
  border: var(--ux-border-w) solid var(--ux-border-c);
  box-shadow: var(--ux-sh-card);
}
.ux-overhead__statuses,
.ux-overhead__items {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.ux-overhead__statuses::-webkit-scrollbar,
.ux-overhead__items::-webkit-scrollbar { display: none; }
.ux-overhead__statuses { min-height: 20px; margin-bottom: 4px; }
.ux-overhead__status {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex: 0 0 auto;
  padding: 2px 7px;
  border-radius: var(--ux-r-full);
  background: var(--ux-surface-2);
  color: var(--ux-ink-2);
  font-size: 10px;
}
.ux-overhead__status[data-tone="danger"] { color: var(--ux-danger); }
.ux-overhead__status[data-tone="ok"] { color: var(--ux-ok); }
.ux-overhead__items { padding: 3px; margin-bottom: 7px; }
.ux-overhead__item {
  position: relative;
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: var(--ux-r-md);
  background: var(--ux-surface);
  border: var(--ux-border-w) solid var(--ux-border-c);
  box-shadow: var(--ux-sh-btn);
}
.ux-overhead__item:disabled { opacity: .35; filter: grayscale(1); }
.ux-overhead__qty {
  position: absolute;
  right: -4px;
  bottom: -4px;
  min-width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  padding: 0 3px;
  border-radius: var(--ux-r-full);
  background: var(--ux-ink);
  color: var(--ux-bg);
  font-size: 9px;
  font-weight: 800;
}
.ux-overhead__avatar {
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ux-primary), var(--ux-accent));
  font-size: 30px;
}
.ux-overhead__name { margin-top: 5px; font-size: var(--ux-fs-sm); font-weight: 800; }
.ux-overhead__name > span { margin-left: 6px; color: var(--ux-primary); font-size: 10px; }
.ux-overhead__health { width: 150px; margin-top: 5px; text-align: center; }
.ux-overhead__health .ux-unit-health { width: 100%; }
.ux-overhead__health .ux-unit-health__text { display: block; }
.ux-unit {
  position: relative;
  display: grid;
  justify-items: center;
  min-width: 76px;
  color: var(--ux-ink);
  text-align: center;
}
.ux-combat-unit {
  padding: 18px 8px 8px;
  border-radius: var(--ux-r-md);
  border: 2px solid transparent;
  background: var(--ux-surface);
}
.ux-combat-unit.is-selected { border-color: var(--ux-accent); box-shadow: var(--ux-glow); }
.ux-unit__overhead {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 3px);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 3px;
  max-width: 150px;
  transform: translateX(-50%);
  pointer-events: none;
  white-space: nowrap;
}
.ux-unit__statuses,
.ux-unit__items { display: flex; gap: 2px; }
.ux-unit__status,
.ux-unit__item {
  position: relative;
  min-width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  padding: 0 3px;
  border-radius: var(--ux-r-sm);
  background: var(--ux-surface);
  border: 1px solid var(--ux-line);
  box-shadow: 0 2px 6px rgba(0,0,0,.16);
  font-size: 10px;
}
.ux-unit__status[data-tone="danger"] { color: var(--ux-danger); }
.ux-unit__status[data-tone="ok"] { color: var(--ux-ok); }
.ux-unit__item b { position: absolute; right: -2px; bottom: -3px; font-size: 8px; }
.ux-unit__stars { min-height: 12px; color: #FFB020; font-size: 10px; letter-spacing: -1px; }
.ux-combat-unit .ux-unit__stars { display: none; }
.ux-unit__avatar {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--ux-primary), var(--ux-accent));
  font-size: 27px;
  box-shadow: var(--ux-sh-btn);
}
.ux-unit[data-team="enemy"] .ux-unit__avatar { background: linear-gradient(135deg, var(--ux-danger), var(--ux-accent)); }
.ux-unit__name {
  max-width: 100px;
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10px;
  font-weight: 800;
}
.ux-unit-health {
  display: block;
  width: 70px;
  height: 6px;
  margin-top: 4px;
  overflow: hidden;
  border-radius: var(--ux-r-full);
  background: rgba(0,0,0,.22);
  border: 1px solid var(--ux-line);
}
.ux-unit-health > i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--ux-ok), #6dff9a);
  transition: width var(--ux-dur) var(--ux-ease);
}
.ux-unit-health__text { margin-top: 1px; color: var(--ux-ink-3); font-size: 8px; font-variant-numeric: tabular-nums; }
.ux-unit.is-dead { opacity: .42; filter: grayscale(1); }
.ux-unit.is-dead .ux-unit__avatar { transform: rotate(12deg); }
.ux-turnbar {
  display: flex;
  gap: 7px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.ux-turnbar__item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: 1 0 auto;
  padding: 7px 10px;
  border-radius: var(--ux-r-full);
  background: var(--ux-surface);
  border: var(--ux-border-w) solid var(--ux-border-c);
  color: var(--ux-ink-3);
  font-size: var(--ux-fs-xs);
}
.ux-turnbar__item strong { color: var(--ux-ink); }

/* ── SLG 地图 ────────────────────────────────── */
.ux-slg {
  padding: 10px;
  border-radius: var(--ux-r-lg);
  background: var(--ux-surface);
  border: var(--ux-border-w) solid var(--ux-border-c);
  box-shadow: var(--ux-sh-card);
}
.ux-slg__layout { display: grid; gap: 10px; }
.ux-slg__map {
  display: grid;
  grid-template-columns: repeat(var(--slg-cols), minmax(0, 1fr));
  gap: 4px;
  min-width: 0;
  padding: 6px;
  border-radius: var(--ux-r-md);
  background: var(--ux-surface-2);
  border: 1px solid var(--ux-line);
}
.ux-slg__cell {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  aspect-ratio: 1;
  padding: 3px;
  border-radius: var(--ux-r-sm);
  background: color-mix(in srgb, var(--ux-ok) 13%, var(--ux-surface));
  border: 1px solid var(--ux-line);
  color: var(--ux-ink);
  transition: transform var(--ux-dur-fast) var(--ux-ease), box-shadow var(--ux-dur-fast) linear;
}
.ux-slg__cell[data-terrain="water"] { background: color-mix(in srgb, var(--ux-accent) 24%, var(--ux-surface)); }
.ux-slg__cell[data-terrain="mountain"] { background: color-mix(in srgb, var(--ux-ink-3) 20%, var(--ux-surface)); }
.ux-slg__cell[data-terrain="city"] { background: color-mix(in srgb, var(--ux-warn) 20%, var(--ux-surface)); }
.ux-slg__cell[data-owner="player"] { box-shadow: inset 0 0 0 2px var(--ux-primary); }
.ux-slg__cell[data-owner="enemy"] { box-shadow: inset 0 0 0 2px var(--ux-danger); }
.ux-slg__cell.is-selected { outline: 3px solid var(--ux-accent); z-index: 1; transform: translateY(-2px); }
.ux-slg__cell.is-target { box-shadow: inset 0 0 0 3px var(--ux-ok), 0 0 12px color-mix(in srgb, var(--ux-ok) 55%, transparent); }
.ux-slg__cell.is-scouted::after { content: "◎"; position: absolute; top: 2px; right: 4px; color: var(--ux-accent); font-size: 11px; }
.ux-slg__terrain { font-size: 20px; line-height: 1; }
.ux-slg__label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
.ux-slg__power { position: absolute; right: 3px; bottom: 2px; font-size: 10px; font-weight: 900; font-variant-numeric: tabular-nums; }
.ux-slg__panel { min-width: 0; }
.ux-slg__detail { min-height: 42px; color: var(--ux-ink-2); font-size: var(--ux-fs-xs); line-height: 1.5; }
.ux-slg__panel .ux-game-action { flex: 1 1 calc(33.333% - 7px); }

/* ── 卡牌战斗 ────────────────────────────────── */
.ux-cardbattle {
  padding: 10px;
  border-radius: var(--ux-r-lg);
  background:
    radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--ux-accent) 15%, transparent), transparent 48%),
    var(--ux-surface);
  border: var(--ux-border-w) solid var(--ux-border-c);
}
.ux-cardbattle__arena { display: grid; gap: 10px; align-items: center; }
.ux-cardbattle__enemies { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding-top: 16px; }
.ux-cardbattle__enemy { min-width: 100px; }
.ux-cardbattle__player { justify-self: center; padding-top: 12px; }
.ux-card-hand {
  display: flex;
  gap: 9px;
  margin: 10px -4px 0;
  padding: 14px 4px 12px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
}
.ux-game-card {
  position: relative;
  flex: 0 0 112px;
  min-height: 154px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 8px 8px;
  scroll-snap-align: start;
  border-radius: var(--ux-r-md);
  border: 2px solid var(--ux-border-c);
  background: linear-gradient(160deg, var(--ux-surface), var(--ux-surface-2));
  box-shadow: var(--ux-sh-card);
  color: var(--ux-ink);
  text-align: center;
  transition: transform var(--ux-dur-fast) var(--ux-ease), opacity var(--ux-dur-fast) linear, border-color var(--ux-dur-fast) linear;
}
.ux-game-card[data-rarity="rare"] { border-color: var(--ux-accent); }
.ux-game-card[data-rarity="epic"] { border-color: #B44DFF; }
.ux-game-card[data-rarity="legend"] { border-color: #FFB020; }
.ux-game-card.is-selected { transform: translateY(-10px); border-color: var(--ux-primary); box-shadow: var(--ux-glow); }
.ux-game-card.is-disabled { opacity: .46; filter: grayscale(.6); }
.ux-game-card__cost {
  position: absolute;
  top: -8px;
  left: -5px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--ux-accent);
  color: #fff;
  border: 2px solid var(--ux-surface);
  font-size: 13px;
  font-weight: 900;
}
.ux-game-card__art { font-size: 32px; line-height: 1.2; }
.ux-game-card__name { font-size: var(--ux-fs-sm); }
.ux-game-card__desc { flex: 1; color: var(--ux-ink-2); font-size: 10px; line-height: 1.35; }
.ux-game-card__type { color: var(--ux-ink-3); font-size: 9px; }
.ux-cardbattle.is-victory { box-shadow: 0 0 0 3px var(--ux-ok), var(--ux-glow); }
.ux-cardbattle.is-defeat { box-shadow: 0 0 0 3px var(--ux-danger); }

/* ── 扑克牌桌 ────────────────────────────────── */
.ux-poker {
  padding: 10px;
  border-radius: var(--ux-r-lg);
  background: var(--ux-surface);
  border: var(--ux-border-w) solid var(--ux-border-c);
}
.ux-poker__opponents { display: flex; justify-content: space-around; gap: 8px; }
.ux-poker-opponent {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-width: 78px;
  color: var(--ux-ink-3);
  font-size: 9px;
}
.ux-poker-opponent strong { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ux-ink); font-size: var(--ux-fs-xs); }
.ux-poker-opponent__avatar { font-size: 25px; }
.ux-poker-opponent b { color: var(--ux-primary); font-size: var(--ux-fs-md); }
.ux-poker__table {
  display: grid;
  place-items: center;
  min-height: 112px;
  margin: 8px 0;
  padding: 12px;
  border-radius: 46% / 24%;
  background:
    radial-gradient(circle, color-mix(in srgb, var(--ux-ok) 22%, var(--ux-surface)), color-mix(in srgb, var(--ux-ok) 10%, var(--ux-surface-2)));
  border: 2px solid color-mix(in srgb, var(--ux-ok) 48%, var(--ux-line));
  box-shadow: var(--ux-inset);
}
.ux-poker__trick { display: flex; justify-content: center; min-height: 68px; align-items: center; }
.ux-poker__waiting { color: var(--ux-ink-3); font-size: var(--ux-fs-xs); }
.ux-poker__played-set { display: flex; justify-content: center; gap: 5px; }
.ux-poker-hand {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  min-height: 102px;
  padding: 18px 5px 10px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
}
.ux-poker-card {
  position: relative;
  flex: 0 0 52px;
  width: 52px;
  height: 76px;
  scroll-snap-align: start;
  border-radius: 7px;
  border: 1px solid #A7A7A7;
  background: #FFF;
  box-shadow: 0 3px 8px rgba(0,0,0,.2);
  color: #202124;
  text-align: left;
  transition: transform var(--ux-dur-fast) var(--ux-ease), opacity var(--ux-dur-fast) linear;
}
.ux-poker-card[data-color="red"] { color: #D63845; }
.ux-poker-card.is-selected { transform: translateY(-12px); outline: 3px solid var(--ux-accent); }
.ux-poker-card__rank { position: absolute; top: 4px; left: 5px; font-size: 17px; font-weight: 900; line-height: 1; }
.ux-poker-card__suit { position: absolute; top: 22px; left: 6px; font-size: 13px; }
.ux-poker-card__suit--large { top: auto; left: auto; right: 5px; bottom: 2px; font-size: 29px; opacity: .85; }
.ux-poker-card--played { flex-basis: 48px; width: 48px; height: 68px; opacity: 1; cursor: default; }
.ux-poker-card--played:disabled { color: inherit; }

/* ── 自走棋 ──────────────────────────────────── */
.ux-tactics {
  padding: 9px;
  border-radius: var(--ux-r-lg);
  background: var(--ux-surface);
  border: var(--ux-border-w) solid var(--ux-border-c);
}
.ux-tactics__status { gap: 5px 10px; }
.ux-tactics__synergies { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.ux-tactics__synergy {
  display: inline-flex;
  gap: 5px;
  padding: 3px 8px;
  border-radius: var(--ux-r-full);
  background: var(--ux-surface-2);
  border: 1px solid var(--ux-line);
  color: var(--ux-ink-3);
  font-size: 9px;
}
.ux-tactics__synergy.is-active { background: color-mix(in srgb, var(--ux-accent) 18%, var(--ux-surface)); border-color: var(--ux-accent); color: var(--ux-ink); }
.ux-tactics__layout { display: grid; gap: 9px; }
.ux-tactics__board {
  display: grid;
  grid-template-columns: repeat(var(--tactics-cols), minmax(0, 1fr));
  gap: 4px;
  min-width: 0;
  padding: 24px 5px 7px;
  border-radius: var(--ux-r-md);
  border: 1px solid var(--ux-line);
  background:
    linear-gradient(45deg, color-mix(in srgb, var(--ux-primary) 7%, transparent) 25%, transparent 25%, transparent 75%, color-mix(in srgb, var(--ux-primary) 7%, transparent) 75%),
    var(--ux-surface-2);
  background-size: 24px 24px;
}
.ux-tactics__slot {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 0;
  min-height: 48px;
  aspect-ratio: 1;
  border-radius: var(--ux-r-sm);
  border: 1px dashed color-mix(in srgb, var(--ux-line) 75%, transparent);
  cursor: pointer;
  transition: background var(--ux-dur-fast) linear, transform var(--ux-dur-fast) var(--ux-ease);
}
.ux-tactics__slot:hover { background: color-mix(in srgb, var(--ux-primary) 10%, transparent); }
.ux-tactics__slot.is-selected { border: 2px solid var(--ux-accent); background: color-mix(in srgb, var(--ux-accent) 16%, transparent); transform: translateY(-2px); }
.ux-tactics__slot:has([data-team="enemy"]) { background: color-mix(in srgb, var(--ux-danger) 10%, transparent); border-color: color-mix(in srgb, var(--ux-danger) 50%, transparent); }
.ux-tactics__slot .ux-unit { min-width: 0; width: 100%; pointer-events: none; }
.ux-unit--compact .ux-unit__avatar { width: 29px; height: 29px; font-size: 18px; }
.ux-unit--compact .ux-unit__name { max-width: 52px; font-size: 8px; }
.ux-unit--compact .ux-unit-health { width: 38px; height: 4px; margin-top: 2px; }
.ux-unit--compact .ux-unit-health__text { display: none; }
.ux-unit--compact .ux-unit__stars { font-size: 8px; min-height: 9px; }
.ux-unit--compact .ux-unit__overhead { bottom: calc(100% + 1px); }
.ux-unit--compact .ux-unit__status,
.ux-unit--compact .ux-unit__item { min-width: 14px; height: 14px; padding: 0 1px; font-size: 8px; }
.ux-tactics__bench-label { margin-bottom: 4px; color: var(--ux-ink-3); font-size: 9px; }
.ux-tactics__bench {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(44px, 1fr);
  gap: 4px;
  padding: 19px 3px 4px;
  overflow-x: auto;
  border-radius: var(--ux-r-sm);
  background: var(--ux-surface-2);
}
.ux-tactics__shop { display: flex; gap: 5px; margin-top: 7px; overflow-x: auto; padding: 3px 1px; }
.ux-tactics__offer {
  position: relative;
  flex: 1 0 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 91px;
  padding: 6px 4px;
  border-radius: var(--ux-r-sm);
  background: var(--ux-surface-2);
  border: 1px solid var(--ux-line);
  color: var(--ux-ink-3);
  font-size: 8px;
}
.ux-tactics__offer strong { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ux-ink); font-size: 10px; }
.ux-tactics__offer b { color: var(--ux-warn); font-size: 10px; }
.ux-tactics__offer-art { font-size: 25px; }
.ux-tactics__offer.is-unaffordable { opacity: .58; }
.ux-tactics__offer.is-sold { opacity: .32; filter: grayscale(1); }
.ux-tactics__offer.is-sold::after { content: "已售"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ux-ink); font-size: 12px; font-weight: 900; }
.ux-tactics__panel { min-width: 0; }
.ux-tactics__panel .ux-game-action { padding-left: 7px; padding-right: 7px; }

/* 横屏：地图/棋盘与操作面板双栏，牌桌压缩纵向空间；窄屏保持单栏。 */
@media (min-width: 640px) {
html[data-kind="game"][data-orientation-view="landscape"] .ux-slg__layout,
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__layout {
  grid-template-columns: minmax(0, 1.25fr) minmax(220px, .9fr);
  align-items: start;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-status { margin-bottom: 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-action { min-height: 34px; padding: 4px 8px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-actions { margin: 4px 0; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-log { min-height: 30px; padding: 6px 8px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-slg__map {
  height: min(260px, calc(100dvh - 210px));
  min-height: 160px;
  grid-auto-rows: 1fr;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-slg__cell { aspect-ratio: auto; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-slg__panel {
  max-height: min(260px, calc(100dvh - 210px));
  overflow-y: auto;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle {
  display: grid;
  grid-template-columns: minmax(180px, .8fr) minmax(0, 1.2fr);
  column-gap: 8px;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle > .ux-game-status { grid-column: 1 / -1; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle__arena {
  grid-column: 1;
  grid-row: 2 / 5;
  grid-template-columns: 1fr;
  align-content: start;
  gap: 4px;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle__enemies { justify-content: center; gap: 4px; padding-top: 0; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle__enemy { min-width: 76px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle .ux-combat-unit { padding: 6px 4px 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle .ux-unit__avatar { width: 34px; height: 34px; font-size: 20px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle .ux-unit-health { width: 50px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle__player { padding-top: 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-card-hand {
  grid-column: 2;
  grid-row: 2;
  min-height: 0;
  margin: 0;
  padding: 9px 2px 5px;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-card { flex-basis: 86px; min-height: 110px; padding: 8px 6px 5px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-card__art { font-size: 25px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-card__desc { font-size: 9px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-game-card__cost { width: 23px; height: 23px; font-size: 11px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle > .ux-game-actions { grid-column: 2; grid-row: 3; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-cardbattle > .ux-game-log { grid-column: 2; grid-row: 4; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  column-gap: 7px;
}
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker > .ux-game-status { grid-column: 1 / -1; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker__opponents { grid-column: 1; grid-row: 2 / 6; flex-direction: column; justify-content: center; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker__table { grid-column: 2; grid-row: 2; min-height: 62px; margin: 3px 0; padding: 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker__trick { min-height: 52px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker-hand { grid-column: 2; grid-row: 3; min-height: 72px; padding: 9px 4px 5px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker-card { width: 42px; height: 58px; flex-basis: 42px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker-card__rank { font-size: 14px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker-card__suit { top: 18px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker-card__suit--large { top: auto; font-size: 22px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker > .ux-game-actions { grid-column: 2; grid-row: 4; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-poker > .ux-game-log { grid-column: 2; grid-row: 5; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__synergies { margin-bottom: 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__board { padding: 18px 4px 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__slot { min-height: 0; height: 44px; aspect-ratio: auto; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__bench-label { display: none; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__bench { padding: 14px 3px 3px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__shop { flex-wrap: nowrap; margin-top: 4px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__offer { min-height: 64px; flex-basis: 58px; padding: 3px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__offer-art { font-size: 20px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics__offer > span:not(.ux-tactics__offer-art) { display: none; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics .ux-unit--compact .ux-unit__avatar { width: 22px; height: 22px; font-size: 14px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics .ux-unit--compact .ux-unit__name { font-size: 7px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics .ux-unit--compact .ux-unit-health { width: 28px; height: 3px; }
html[data-kind="game"][data-orientation-view="landscape"] .ux-tactics .ux-unit--compact .ux-unit__stars { min-height: 7px; font-size: 7px; }
}

/* ── 战斗与操作反馈动画 ───────────────────────── */
@keyframes ux-game-float {
  0% { opacity: 0; transform: translate(-50%, 4px) scale(.75); }
  18% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%, -52px) scale(1); }
}
@keyframes ux-deal {
  from { opacity: 0; transform: translateY(24px) rotate(4deg) scale(.85); }
  to { opacity: 1; transform: none; }
}
@keyframes ux-hit {
  0%, 100% { transform: translateX(0); filter: none; }
  25% { transform: translateX(-6px); filter: brightness(1.7) saturate(1.6); }
  55% { transform: translateX(5px); }
  75% { transform: translateX(-2px); }
}
@keyframes ux-heal {
  0%, 100% { filter: none; }
  50% { filter: drop-shadow(0 0 12px var(--ux-ok)); transform: scale(1.06); }
}
@keyframes ux-lunge {
  0%, 100% { transform: translateY(0) scale(1); }
  45% { transform: translateY(-12px) scale(1.08); }
}
@keyframes ux-land {
  0% { opacity: .45; transform: translateY(-20px) scale(1.12); }
  70% { transform: translateY(3px) scale(.96); }
  100% { opacity: 1; transform: none; }
}
@keyframes ux-level-up {
  0% { transform: scale(.8); filter: none; }
  55% { transform: scale(1.2); filter: drop-shadow(0 0 16px #FFB020); }
  100% { transform: scale(1); filter: none; }
}
@keyframes ux-glow-once {
  0%, 100% { filter: none; }
  50% { filter: drop-shadow(0 0 14px var(--ux-accent)); }
}
@keyframes ux-card-leave {
  to { opacity: 0; transform: translateY(-34px) rotate(-5deg) scale(.72); }
}
.ux-game-float {
  position: absolute;
  z-index: 80;
  pointer-events: none;
  color: var(--ux-danger);
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  text-shadow: 0 2px 4px var(--ux-surface), 0 0 8px var(--ux-surface);
  animation: ux-game-float .85s var(--ux-ease) both;
}
.ux-game-float--heal { color: var(--ux-ok); }
.ux-game-float--shield { color: var(--ux-accent); }
.ux-game-float--buff { color: #FFB020; font-size: 18px; }
.anim-deal { animation: ux-deal .38s var(--ux-ease) both; }
.anim-hit { animation: ux-hit .36s var(--ux-ease) both; }
.anim-heal { animation: ux-heal .48s var(--ux-ease) both; }
.anim-lunge { animation: ux-lunge .42s var(--ux-ease) both; }
.anim-land { animation: ux-land .42s var(--ux-ease) both; }
.anim-level-up { animation: ux-level-up .65s var(--ux-ease) both; }
.anim-glow-once { animation: ux-glow-once .6s var(--ux-ease) both; }
.ux-game-card.is-leaving,
.ux-poker-card.is-leaving { animation: ux-card-leave .24s ease-in both; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  [data-game-root] *,
  [data-game-root] *::before,
  [data-game-root] *::after,
  .ux-game-float {
    animation: none !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .ux-game-card.is-selected,
  .ux-poker-card.is-selected { transform: none; }
}
